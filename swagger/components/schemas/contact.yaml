type: object
required:
    - _id
    - name
    - phoneNumber
    - email
    - isFavourite
    - contactType
properties:
    _id:
        description: "Contact's id"
        type: string
        example: 65e4decdd286b30065d54af9
    name:
        description: "Contact's name"
        type: string
        example: "John Doe"
    phoneNumber:
        description: "Contact's Phone Number"
        type: number
        example: "5327444444"
    email:
        description: "Contact's email"
        type: string
        example: "johndoe@data.com"
    isFavourite:
        description: "Contact if its favourited or not"
        type: boolean
        example: false
    contactType:
        description: "Contact Type"
        type: string
        enum: ["work", "home", "personal"]
    photo:
        description: "Link to contact's photo"
        type: string
        example: "https://res.cloudinary.com/uqwgdu/image/upload/image.png"
