tags:
    - Contacts
summary: Create contact
operationId: createContact
description: "Create a contact with payload"
security:
    - bearerAuth: []
requestBody:
    content:
        multipart/form-data:
            schema:
                type: object
                required:
                    - name
                    - phoneNumber
                    - email
                    - isFavourite
                    - contactType
                    - photo
                properties:
                    name:
                        description: "Contact's name"
                        type: string
                        example: "John Doe"
                    phoneNumber:
                        description: "Contact's Phone Number"
                        type: string
                        example: "5327444444"
                    email:
                        description: "Contact's email"
                        type: string
                        example: "johndoe@data.com"
                    isFavourite:
                        description: "Contact if its favourited or not"
                        type: boolean
                        example: false
                    contactType:
                        description: "Contact Type"
                        type: string
                        enum: ["work", "home", "personal"]
                    photo:
                        description: "Link to contact's photo"
                        type: string
                        format: binary

responses:
    "201":
        description: Creates a Contact
        content:
            application/json:
                schema:
                    type: object
                    required:
                        - status
                        - message
                        - data
                    properties:
                        status:
                            type: integer
                            example: 201
                        message:
                            type: string
                            example: Successfully created a contact!
                        data:
                            type: object
                            $ref: "../../components/schemas/contact.yaml"
    "401":
        $ref: "../../components/responses/401.yaml"
